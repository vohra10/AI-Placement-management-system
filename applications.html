<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Applications - AI Placement Management System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #222;
        }

        .navbar {
            background: #172554;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            font-size: 22px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            font-size: 15px;
        }

        .navbar a:hover {
            text-decoration: underline;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 35px auto;
        }

        .heading {
            margin-bottom: 25px;
        }

        .heading h1 {
            font-size: 30px;
            color: #172554;
            margin-bottom: 8px;
        }

        .heading p {
            color: #666;
        }

        .application-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .company {
            font-size: 24px;
            font-weight: bold;
            color: #172554;
            margin-bottom: 8px;
        }

        .role {
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 18px;
        }

        .details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .detail {
            background: #f8fafc;
            padding: 12px;
            border-radius: 8px;
        }

        .detail strong {
            display: block;
            color: #555;
            font-size: 13px;
            margin-bottom: 5px;
        }

        .detail span {
            font-size: 15px;
        }

        .status {
            display: inline-block;
            padding: 8px 18px;
            border-radius: 20px;
            background: #fff7ed;
            color: #c2410c;
            font-weight: bold;
            margin-top: 5px;
        }

        .empty {
            background: white;
            padding: 50px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .empty h2 {
            color: #172554;
            margin-bottom: 10px;
        }

        .back-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 11px 20px;
            background: #172554;
            color: white;
            text-decoration: none;
            border-radius: 7px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 15px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <h2>AI Placement Management System</h2>

        <div>
            <a href="dashboard.html">Dashboard</a>
            <a href="jobs.html">Jobs</a>
            <a href="myapplications.html">My Applications</a>
        </div>
    </div>

    <div class="container">

        <div class="heading">
            <h1>My Applications</h1>
            <p>Track all the jobs you have applied for.</p>
        </div>

        <div id="applicationsContainer">
            <div class="loading">
                Loading your applications...
            </div>
        </div>

    </div>

    <script>

        // Get logged-in student
        const currentUser = JSON.parse(
            localStorage.getItem("currentUser")
        );

        // Check login
        if (!currentUser || !currentUser.id) {

            window.location.href = "index.html";

        }

        async function loadApplications() {

            const container =
                document.getElementById("applicationsContainer");

            try {

                const response = await fetch(
                    `/student/${currentUser.id}/applications`
                );

                const data = await response.json();

                if (!response.ok) {

                    throw new Error(
                        data.error || "Could not load applications"
                    );

                }

                // Different possible backend response formats
                const applications =
                    Array.isArray(data)
                        ? data
                        : (data.applications || []);

                if (applications.length === 0) {

                    container.innerHTML = `
                        <div class="empty">

                            <h2>No Applications Yet</h2>

                            <p>
                                You have not applied for any jobs yet.
                            </p>

                            <a href="jobs.html" class="back-btn">
                                Browse Jobs
                            </a>

                        </div>
                    `;

                    return;
                }

                container.innerHTML = "";

                applications.forEach(application => {

                    const company =
                        application.company ||
                        application.company_name ||
                        "Company";

                    const role =
                        application.job_role ||
                        application.role ||
                        "Job Position";

                    const location =
                        application.location ||
                        "Not specified";

                    const salary =
                        application.salary ||
                        "Not specified";

                    const status =
                        application.status ||
                        "Applied";

                    const appliedDate =
                        application.applied_date ||
                        application.created_at ||
                        application.date ||
                        "Recently";

                    const card = document.createElement("div");

                    card.className = "application-card";

                    card.innerHTML = `

                        <div class="company">
                            ${company}
                        </div>

                        <div class="role">
                            ${role}
                        </div>

                        <div class="details">

                            <div class="detail">
                                <strong>Location</strong>
                                <span>${location}</span>
                            </div>

                            <div class="detail">
                                <strong>Salary</strong>
                                <span>${salary}</span>
                            </div>

                            <div class="detail">
                                <strong>Applied</strong>
                                <span>${appliedDate}</span>
                            </div>

                        </div>

                        <strong>Status:</strong>

                        <div class="status">
                            ${status}
                        </div>

                    `;

                    container.appendChild(card);

                });

            } catch (error) {

                console.error(error);

                container.innerHTML = `

                    <div class="error">

                        Could not load applications.

                        <br><br>

                        ${error.message}

                    </div>

                `;

            }

        }

        loadApplications();

    </script>

</body>
</html>
